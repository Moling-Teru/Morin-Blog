<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网易云音乐播放器</title>
  <link rel="stylesheet" href="./player.css">
  <script src="./player.js" defer></script>
</head>
<body>
  <section class="player" aria-label="网易云音乐">
    <div class="player__info">
      <div class="player__cover" id="cover-wrap" aria-hidden="true" title="播放 / 暂停">
        <span>♫</span>
        <img id="cover" alt="" hidden referrerpolicy="no-referrer">
      </div>
      <div class="player__details">
        <strong id="title">网易云音乐</strong>
        <span id="artist">外链播放器</span>
      </div>
      <span class="player__accent" aria-hidden="true"></span>
      <a id="song-link" target="_blank" rel="noopener noreferrer" hidden>在网易云打开 ↗</a>
    </div>
    <div class="player__content">
      <audio id="audio" loop preload="none" aria-label="歌曲播放控制"></audio>
      <div class="player__controls" id="controls">
        <button type="button" class="player__btn-play" id="play-btn" aria-label="播放">
          <svg class="icon-play" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l11-6.86a1 1 0 0 0 0-1.68l-11-6.86A1 1 0 0 0 8 5.14z"/>
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" hidden>
            <path d="M7 5a1 1 0 0 1 1 1v12a1 1 0 1 1-2 0V6a1 1 0 0 1 1-1zm10 0a1 1 0 0 1 1 1v12a1 1 0 1 1-2 0V6a1 1 0 0 1 1-1z"/>
          </svg>
        </button>
        <div class="player__progress-area">
          <span class="player__time" id="current-time">0:00</span>
          <div class="player__slider" id="progress-slider" role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="player__slider-track">
              <div class="player__slider-fill" id="progress-fill"></div>
            </div>
            <div class="player__slider-thumb" id="progress-thumb"></div>
          </div>
          <span class="player__time" id="duration-time">--:--</span>
        </div>
        <button type="button" class="player__btn-vol" id="volume-btn" aria-label="静音切换">
          <svg class="icon-volume" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg class="icon-muted" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" hidden>
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>
      </div>
      <div class="player__footer">
        <span id="status" role="status" aria-live="polite"></span>
        <span id="lyric" hidden></span>
        <span class="player__meta" aria-hidden="true">NETEASE CLOUD MUSIC</span>
      </div>
      <noscript>
        <style>
          .player__controls { display: none !important; }
          audio { display: block !important; width: 100%; height: 36px; }
        </style>
        请启用 JavaScript 后获得更佳体验。
      </noscript>
    </div>
  </section>
</body>
</html>
